name: Generate TMDB Backgrounds

on:
  schedule:
    - cron: '0 0 * * *' # Automatically runs every day at midnight
  workflow_dispatch:   # Allows manual execution

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 1. Allows pushing changes back to the repo

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Run TMDB Color Script
        env:
          # 2. Pass your TMDB API keys securely from GitHub Secrets to the script
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }} 
          TMDB_LANGUAGE: "en-US"
        run: python TMDB_color.py

      - name: Commit and Push Wallpapers
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # Stage the default output folder used by this repo
          git add output/ 
          
          if git diff --staged --quiet; then
            echo "No new images found."
          else
            git commit -m "Automated TV Background Refresh [skip ci]"
            git push
          fi
