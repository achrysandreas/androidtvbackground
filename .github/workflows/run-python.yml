name: Generate TMDB Backgrounds

on:
  schedule:
    - cron: '0 0 * * *' # Automatically runs every day at midnight
  workflow_dispatch:   # Allows manual execution

jobs:
  run-and-push:
    runs-on: ubuntu-latest
    
    # 🌟 THIS KEY IS REQURED TO RESOLVE EXIT CODE 128
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Run TMDB Color Script
        env:
          # This maps your hidden GitHub secret into an environment variable the script can see
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TMDB_LANGUAGE: "en-US"
          # Add any other variables here that are required by the .env.example file
        run: python TMDB_color.py

      - name: Commit and Push Wallpapers
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@://github.com"
          
          # 1. Look for any untracked or modified files across the whole workspace safely
          git add -A
          
          # 2. Check if anything was actually staged
          if git diff --staged --quiet; then
            echo "No new images or changes were generated by the script."
          else
            git commit -m "Automated TV Background Refresh [skip ci]"
            git push origin main
          fi
