name: Run Python Script

# Controls when the workflow will run
on:
  schedule:
    # Runs automatically every day at midnight UTC
    - cron: '0 0 * * 6'
  workflow_dispatch: # Allows you to run it manually anytime

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out the repository code so the runner can access your script
      - name: Checkout repository code
        uses: actions/checkout@v4

      # Step 2: Set up the Python environment
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11' # Specify your preferred Python version

      # Step 3: Install dependencies (optional)
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # Step 4: Run your Python script
      - name: Execute Python script
        run: python TMDB_color.py # Replace main.py with the path to your script
