stages:
  - build

generate_overflight_json:
  stage: build
  image: python:3.11-alpine
  rules:
    # Only run when files inside the wallpapers/ directory change
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - tmdb_backgrounds2/**/*
  before_script:
    - apk add --no-cache git
  script:
    - |
      python3 -c '
      import os, json, urllib.parse

      project_url = os.environ["CI_PROJECT_URL"]
      branch = os.environ["CI_DEFAULT_BRANCH"]
      folder = "tmdb_backgrounds2"
      extensions = (".jpg", ".jpeg", ".png", ".webp")
      items = []

      if os.path.exists(folder):
          for filename in sorted(os.listdir(folder)):
              if filename.lower().endswith(extensions):
                  encoded_name = urllib.parse.quote(filename)
                  raw_url = f"{project_url}/-/raw/{branch}/{folder}/{encoded_name}"
                  title = os.path.splitext(filename)[0].replace("_", " ").replace("-", " ").title()
                  items.append({
                      "title": title,
                      "author": "GitLab Wallpaper Feed",
                      "url_img": raw_url
                  })

      with open("wallpapers.json", "w", encoding="utf-8") as f:
          json.dump(items, f, indent=2)
      '
    - |
      git config user.name "GitLab CI"
      git config user.email "ci@gitlab.com"
      git add wallpapers.json
      # Commit and push only if wallpapers.json actually changed (-o ci.skip prevents infinite loop)
      if ! git diff --cached --quiet; then
        git commit -m "chore: update wallpapers.json [skip ci]"
        git push -o ci.skip "https://oauth2:${GITLAB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git" "HEAD:${CI_DEFAULT_BRANCH}"
      fi
